name: Long-horizon rare-event stress

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Number of deterministic exposure seeds
        required: true
        default: '12'
      episodes:
        description: Stateful stress episodes per seed
        required: true
        default: '180'
      master_seed:
        description: Master deterministic seed
        required: true
        default: '87161850'
      profiles:
        description: Comma-separated generic policy profiles
        required: true
        default: 'conventional-rtt2,communication-supervised-rtt2,fixed-observation-window,smart-waveform-assisted'

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Run accelerated long-horizon campaign
        run: >-
          npm run benchmark:stress --
          --seeds "${{ inputs.seeds }}"
          --episodes "${{ inputs.episodes }}"
          --seed "${{ inputs.master_seed }}"
          --profiles "${{ inputs.profiles }}"
          --output artifacts/long-horizon-stress
      - name: Upload stress report and deterministic failures
        uses: actions/upload-artifact@v7
        with:
          name: line-differential-relay-lab-long-horizon-stress
          path: artifacts/long-horizon-stress
          if-no-files-found: error
          retention-days: 30
