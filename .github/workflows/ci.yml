name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate
        run: npm run validate
      - name: Upload Monte Carlo smoke report
        uses: actions/upload-artifact@v7
        with:
          name: line-differential-relay-lab-validation-smoke
          path: artifacts/validation
          if-no-files-found: error
          retention-days: 14
      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: line-differential-relay-lab-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
