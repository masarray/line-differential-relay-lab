name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate
        run: npm run validate
      - name: Package deployable site
        run: |
          cd dist
          zip -r ../line-differential-relay-lab-pages-${GITHUB_REF_NAME}.zip .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "line-differential-relay-lab-pages-${GITHUB_REF_NAME}.zip" \
            --generate-notes \
            --title "Line Differential Relay Algorithm Laboratory ${GITHUB_REF_NAME}"
